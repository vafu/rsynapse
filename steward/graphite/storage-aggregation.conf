# Event increments sum across archives; state retains its last value.
[rsynapse-state]
pattern = ^rsynapse\.activity\.state$
xFilesFactor = 0
aggregationMethod = last

[rsynapse-increments]
pattern = ^rsynapse\.
xFilesFactor = 0
aggregationMethod = sum

[min]
pattern = \.lower$
xFilesFactor = 0.1
aggregationMethod = min

[max]
pattern = \.upper$
xFilesFactor = 0.1
aggregationMethod = max

[sum-and-count]
pattern = (\.(sum|count)$|^stats_counts\.)
xFilesFactor = 0
aggregationMethod = sum

[default-average]
pattern = .*
xFilesFactor = 0.3
aggregationMethod = average
