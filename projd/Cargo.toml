[package]
name = "projd"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "projd"

[[bin]]
name = "projd"
path = "src/main.rs"
[[bin]]
name = "proj"
path = "src/cli.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
futures-util = "0.3"
notify = "8.2"
proj-model = { package = "rsynapse-projd-model", path = "model" }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros","rt-multi-thread","sync","signal"] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
