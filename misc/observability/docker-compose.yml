# Local-only metrics stack for rsynapse-metrics.
#
#   docker compose -f observability/docker-compose.yml up -d
#
# Graphite (carbon + whisper + graphite-web, Apache-2.0) receives the
# plaintext metrics on 2003; Grafana OSS (AGPL-3.0) visualizes them on
# 3000. Every published port binds 127.0.0.1 only: nothing here is
# reachable off this machine.
name: metrics

services:
  graphite:
    image: ${GRAPHITE_IMAGE:-graphiteapp/graphite-statsd:1.1.10-5}
    restart: unless-stopped
    ports:
      - "127.0.0.1:2003:2003"
      - "127.0.0.1:8080:80"
    volumes:
      - graphite-storage:/opt/graphite/storage
      - ./graphite/storage-aggregation.conf:/opt/graphite/conf/storage-aggregation.conf:ro

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:12.2.0}
    restart: unless-stopped
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: rsynapse-workday-targets-panel,rsynapse-workday-panel,rsynapse-goal-metrics-panel
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${RSYNAPSE_GRAFANA_DASHBOARDS:-./grafana/dashboards}:/etc/grafana/dashboards:ro
      - ../dashboard-api/grafana-plugin/dist-targets:/var/lib/grafana/plugins/rsynapse-workday-targets-panel:ro
      - ../dashboard-api/grafana-plugin/dist-workday:/var/lib/grafana/plugins/rsynapse-workday-panel:ro
      - ../dashboard-api/grafana-plugin/dist-metrics:/var/lib/grafana/plugins/rsynapse-goal-metrics-panel:ro

volumes:
  graphite-storage:
  grafana-storage:
