[package]
name = "rsynapse-steward"
version = "0.1.0"
edition = "2024"
description = "Headless session steward for the Rsynapse desktop: metrics, workspace naming, project git status"
publish = false
autobins = false

[[bin]]
name = "rsynapse-steward"
path = "src/main.rs"

[dependencies]
desktop-entry.workspace = true
steward-api.workspace = true
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
graphyne = "0.2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
shlex = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
locus.workspace = true
proj-model.workspace = true
workspace-dbus-api.workspace = true
data-sources.workspace = true
shell-rx-macros.workspace = true
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "time", "process"] }
zbus = { version = "4.4.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
