[package]
name = "rsynapse-notifications"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "rsynapse_notifications"
path = "src/lib.rs"

[[bin]]
name = "rsynapse-notifications"
path = "src/main.rs"

[dependencies]
app-kit.workspace = true
data-sources.workspace = true
async-channel = "2.5.0"
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_9"] }
gtk.workspace = true
relm4 = { version = "0.11.0", features = ["libadwaita"] }
regex = "1.12.4"
serde = { version = "1", features = ["derive"] }
shell-core.workspace = true
shell-reactive.workspace = true
shell-macros.workspace = true
shell-rx-macros.workspace = true
tokio = { version = "1.52.3", features = ["fs", "rt-multi-thread", "time"] }
toml = "1.1.2"
tracing.workspace = true
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
zbus = { version = "4.4.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
