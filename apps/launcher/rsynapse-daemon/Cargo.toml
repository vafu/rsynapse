[package]
name = "rsynapse-daemon"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "process"] }
zbus = "4.4"
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
dirs = "6"
toml = "0.8"
notify = "6.1.1"
rsynapse-launcher-api = { path = "../rsynapse-launcher-api" }
rsynapse-plugin = { path = "../rsynapse-plugin" }
rsynapse-plugin-audio = { path = "../rsynapse-plugin-audio" }
rsynapse-plugin-bluetooth = { path = "../rsynapse-plugin-bluetooth" }
rsynapse-plugin-calc = { path = "../rsynapse-plugin-calc" }
rsynapse-plugin-commands = { path = "../rsynapse-plugin-commands" }
rsynapse-plugin-launcher = { path = "../rsynapse-plugin-launcher" }
rsynapse-plugin-mpris = { path = "../rsynapse-plugin-mpris" }
rsynapse-plugin-shell = { path = "../rsynapse-plugin-shell" }
rsynapse-plugin-workspaces = { path = "../rsynapse-plugin-workspaces" }
