[package]
name = "rsynapse-cli"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
zbus = "4.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tabled = "0.15"
rsynapse-launcher-api = { path = "../rsynapse-launcher-api" }
