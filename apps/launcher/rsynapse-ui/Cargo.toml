[package]
name = "rsynapse-ui"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rsynapse-ui"
path = "src/main.rs"

[dependencies]
async-channel = "2"
relm4 = { version = "0.11", features = ["libadwaita"] }
gtk4-layer-shell = "0.8"
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1.52", features = ["rt-multi-thread"] }
anyhow = "1"
rsynapse-launcher-api = { path = "../rsynapse-launcher-api" }
shell-core = { path = "../../../core/shell-core" }
