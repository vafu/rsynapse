[package]
name = "rsynapse-remarked"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_9"] }
gtk.workspace = true
relm4 = { version = "0.11.0", features = ["libadwaita"] }
sourceview5 = "0.11.2"
markdown = "1.0.0"
shell-core.workspace = true
shell-macros.workspace = true
shell-source.workspace = true
task-notes.workspace = true
futures-util = "0.3"
tokio = { version = "1.52", features = ["fs", "sync"] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
proj-model = { package = "rsynapse-projd-model", path = "../../projd/model" }
notebook-api = { path = "../notebook-api", features = ["dbus"] }
