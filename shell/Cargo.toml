[workspace]
members = [
    "core/shell-core",
    "core/shell-source",
    "core/macros",
    "core/rx-macros",
    "app",
    "widgets/nerd-icon-picker",
    "examples/battery-status",
    "examples/volume-status",
    "examples/window-tiles",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_22"] }
gtk4-layer-shell = "0.8.0"
relm4 = "0.11.0"
rxrust = "1.0.0-rc.5"
shell-core = { path = "core/shell-core" }
shell-source = { path = "core/shell-source" }
shell-macros = { path = "core/macros" }
shell-rx-macros = { path = "core/rx-macros" }
nerd-icon-picker = { path = "widgets/nerd-icon-picker" }
tracing = "0.1.44"
