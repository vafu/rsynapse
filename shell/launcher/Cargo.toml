[workspace]
members = [
    "rsynapse-daemon",
    "rsynapse-cli", 
    "rsynapse-plugin", 
    "rsynapse-launcher-api",
    "rsynapse-plugin-launcher",
    "rsynapse-plugin-shell",
    "rsynapse-plugin-calc",
    "rsynapse-plugin-commands",
    "rsynapse-plugin-workspaces",
    "rsynapse-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
