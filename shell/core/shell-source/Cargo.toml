[package]
name = "shell-source"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
notify = "6.1.1"
libc = "0.2"
workspace-policy = { path = "../workspace-policy" }
steward-api = { path = "../../../steward-api" }
async-channel = "2.5.0"
futures-util = "0.3.32"
locus = { path = "../../../locus" }
rxrust.workspace = true
shell-rx-macros = { path = "../rx-macros" }
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "sync", "net", "time"] }
tracing.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "4.4.0", default-features = false, features = ["tokio"] }
proj-model = { package = "rsynapse-projd-model", path = "../../../projd/model" }
workspace-dbus-api = { path = "../../../workspace-dbus/api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.3", features = ["time"] }
