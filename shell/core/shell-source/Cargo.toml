[package]
name = "shell-source"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-channel = "2.5.0"
futures-util = "0.3.32"
rxrust.workspace = true
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "net"] }
tracing.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "4.4.0", default-features = false, features = ["tokio"] }
proj-model = { package = "rsynapse-projd-model", path = "../../../projd/model" }
serde = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.3", features = ["time"] }
