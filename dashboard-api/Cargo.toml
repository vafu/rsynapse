[package]
name = "rsynapse-dashboard-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
futures-util = "0.3"
goal-model = { package = "rsynapse-projd-model", path = "../projd/model" }
locus = { path = "../locus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
